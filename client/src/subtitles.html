<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws: wss:"
    />
    <title>Live Subtitles</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="subtitles-window">
    <div class="subtitles">
      <header class="subtitles-header">
        <span class="status-dot" id="subtitles-dot"></span>
        <span class="subtitles-title" data-i18n="subtitles.button"></span>
        <span class="spacer"></span>
        <select class="compact" id="subtitles-source" data-i18n-title="translation.from"></select>
        <svg class="subtitles-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5" /></svg>
        <select class="compact" id="subtitles-target" data-i18n-title="translation.to"></select>
        <button type="button" class="icon-button" id="subtitles-close" data-i18n-title="live.close">
          <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg>
        </button>
      </header>

      <div class="subtitles-body" id="subtitles-body">
        <p class="subtitles-placeholder" id="subtitles-placeholder"></p>
        <div class="subtitles-text" id="subtitles-text"></div>
      </div>

      <footer class="subtitles-footer">
        <button type="button" class="primary-button wide" id="subtitles-start"></button>
      </footer>
    </div>

    <script src="prefs.js"></script>
    <script src="i18n.js"></script>
    <script src="languages.js"></script>
    <script src="dropdown.js"></script>
    <script src="subtitles.js"></script>
  </body>
</html>
