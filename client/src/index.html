<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:; connect-src 'self' http: https: ws: wss:"
    />
    <title>Sintem Voice</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="main-window">
    <div class="splash" id="splash">
      <div class="logo logo-large">
        <svg viewBox="0 0 24 24"><path d="M5 10v4M8.5 7v10M12 4v16M15.5 8v8M19 10.5v3" /></svg>
      </div>
      <div class="splash-title">Sintem Voice</div>
      <div class="splash-subtitle" data-i18n="splash.opening"></div>
    </div>

    <div class="window-controls" id="window-controls">
      <button type="button" class="window-button" id="window-minimize" data-i18n-title="window.minimize">
        <svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg>
      </button>
      <button type="button" class="window-button" id="window-maximize" data-i18n-title="window.maximize">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg>
      </button>
      <button type="button" class="window-button window-close" id="window-close" data-i18n-title="window.close">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg>
      </button>
    </div>

    <div class="app">
      <nav class="sidebar">
        <div class="logo sidebar-logo">
          <svg viewBox="0 0 24 24"><path d="M5 10v4M8.5 7v10M12 4v16M15.5 8v8M19 10.5v3" /></svg>
        </div>
        <div class="nav-list">
          <a class="nav-link" href="#voice-translation" data-page="voice-translation">
            <svg viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4" /></svg>
            <span class="nav-tooltip" data-i18n="nav.translation"></span>
          </a>
          <a class="nav-link" href="#voice-clone" data-page="voice-clone">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" /></svg>
            <span class="nav-tooltip" data-i18n="nav.clone"></span>
          </a>
        </div>
        <a class="nav-link" href="#settings" data-page="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
          <span class="nav-tooltip" data-i18n="nav.settings"></span>
        </a>
      </nav>

      <main class="content">
        <div class="topbar">
          <button type="button" class="ghost-button subtitles-toggle" id="subtitles-toggle" aria-pressed="false">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="M7 11h4M13.5 11H17M7 15h6.5M16 15h1" /></svg>
            <span data-i18n="subtitles.button"></span>
          </button>
        </div>

        <section class="page" id="page-voice-translation" hidden>
          <header class="page-header">
            <h1 data-i18n="translation.title"></h1>
            <p data-i18n="translation.subtitle"></p>
          </header>
          <div class="voice-stage">
            <div class="orb" id="live-dock">
              <canvas class="orb-wave" id="live-wave"></canvas>
              <button type="button" class="mic-button" id="live-start">
                <svg class="icon-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" /></svg>
                <span class="icon-stop"></span>
              </button>
            </div>
            <p class="dock-status" id="live-hint"></p>
          </div>

          <div class="dock lang-dock">
            <select class="lang-select" id="live-source" data-i18n-title="translation.from"></select>
            <button type="button" class="swap-button" id="live-swap" data-i18n-title="translation.swap">
              <svg viewBox="0 0 24 24"><path d="M5 8h13l-3.5-3.5M19 16H6l3.5 3.5" /></svg>
            </button>
            <select class="lang-select" id="live-target" data-i18n-title="translation.to"></select>
          </div>

          <div class="lock-overlay" id="unlock" hidden>
            <div class="card lock-card">
              <div class="badge-icon">
                <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
              </div>
              <h2 data-i18n="unlock.title"></h2>
              <p class="muted" data-i18n="unlock.body"></p>
              <ol class="steps">
                <li class="step" id="step-mic">
                  <span class="step-mark">
                    <span class="step-number">1</span>
                    <svg class="step-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
                    <svg class="step-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
                  </span>
                  <span class="step-text">
                    <strong data-i18n="unlock.mic"></strong>
                    <span data-i18n="unlock.micHint"></span>
                  </span>
                  <a class="primary-button small" href="#settings" data-i18n="unlock.openSettings"></a>
                </li>
                <li class="step" id="step-voice">
                  <span class="step-mark">
                    <span class="step-number">2</span>
                    <svg class="step-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
                    <svg class="step-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
                  </span>
                  <span class="step-text">
                    <strong data-i18n="unlock.voice"></strong>
                    <span data-i18n="unlock.voiceHint"></span>
                  </span>
                  <a class="primary-button small" href="#voice-clone" data-i18n="unlock.openClone"></a>
                </li>
              </ol>
            </div>
          </div>
        </section>

        <section class="page" id="page-voice-clone" hidden>
          <header class="page-header">
            <h1 data-i18n="clone.title"></h1>
            <p data-i18n="clone.subtitle"></p>
          </header>
          <div class="teleprompter">
            <div class="prompt-toolbar">
              <div class="segmented" id="voice-language" role="radiogroup" data-i18n-title="clone.textLanguage">
                <button type="button" role="radio" data-value="en">EN</button>
                <button type="button" role="radio" data-value="ru">RU</button>
              </div>
              <button type="button" class="ghost-button" id="voice-new-text">
                <svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v5h-5" /></svg>
                <span data-i18n="clone.newText"></span>
              </button>
            </div>
            <blockquote class="voice-prompt" id="voice-prompt"></blockquote>
            <p class="prompt-hint" data-i18n="clone.cardHint"></p>
          </div>

          <p class="dock-status" id="voice-status"></p>
          <div class="dock recorder" id="recorder">
            <div class="recorder-time">
              <span class="rec-dot"></span>
              <span class="timer" id="voice-timer">0:00 / 0:10</span>
            </div>
            <button type="button" class="round-button" id="voice-pause" hidden>
              <svg class="icon-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" /></svg>
              <svg class="icon-resume" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" /></svg>
            </button>
            <button type="button" class="record-button" id="voice-record">
              <span class="rec-icon"></span>
            </button>
            <button type="button" class="primary-button" id="voice-create" disabled data-i18n="clone.create"></button>
            <div class="progress"><div class="progress-fill" id="voice-progress"></div></div>
          </div>
        </section>

        <section class="page" id="page-settings" hidden>
          <header class="page-header">
            <h1 data-i18n="settings.title"></h1>
            <p data-i18n="settings.subtitle"></p>
          </header>
          <div class="page-body narrow settings">
            <div class="card setting-card">
              <div class="setting-text">
                <h2 data-i18n="settings.language"></h2>
                <p class="muted" data-i18n="settings.languageHint"></p>
              </div>
              <select class="select" id="ui-language">
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="es">Español</option>
              </select>
            </div>

            <div class="card setting-card">
              <div class="setting-text">
                <h2 data-i18n="settings.input"></h2>
                <p class="muted" id="input-mic-hint"></p>
              </div>
              <select class="select" id="input-mic"></select>
            </div>

            <div class="card setting-card setting-column">
              <div class="setting-row">
                <div class="setting-text">
                  <h2>
                    <span data-i18n="settings.virtual"></span>
                    <span class="pill" id="vm-status"></span>
                  </h2>
                  <p class="muted" data-i18n="settings.virtualHint"></p>
                </div>
              </div>
              <div class="setting-row">
                <p class="muted vm-hint" id="vm-hint"></p>
                <select class="select" id="vm-device" hidden></select>
                <button type="button" class="primary-button" id="vm-toggle"></button>
              </div>
              <div class="divider"></div>
              <label class="setting-row switch-row">
                <span class="setting-text">
                  <strong data-i18n="settings.mix"></strong>
                  <span class="muted" data-i18n="settings.mixHint"></span>
                </span>
                <input type="checkbox" class="switch" id="vm-mix" />
              </label>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="offline" id="offline" hidden>
      <canvas class="offline-wave" id="offline-wave"></canvas>
      <div class="card offline-card">
        <div class="badge-icon">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="6.5" rx="2" /><rect x="3.5" y="13.5" width="17" height="6.5" rx="2" /><path d="M7 7.25h.01M7 16.75h.01M3 3l18 18" /></svg>
        </div>
        <h2 data-i18n="offline.title"></h2>
        <p class="muted" data-i18n="offline.body"></p>
        <button type="button" class="primary-button wide" id="offline-retry" data-i18n="offline.retry"></button>
        <form class="address-form" id="offline-form">
          <label class="field-label" for="offline-address" data-i18n="offline.address"></label>
          <div class="address-row">
            <input class="input" id="offline-address" type="text" spellcheck="false" placeholder="http://localhost:3000" />
            <button type="submit" class="secondary-button" data-i18n="offline.connect"></button>
          </div>
        </form>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="prefs.js"></script>
    <script src="i18n.js"></script>
    <script src="languages.js"></script>
    <script src="dropdown.js"></script>
    <script src="wave.js"></script>
    <script src="audio.js"></script>
    <script src="renderer.js"></script>
    <script src="settings.js"></script>
    <script src="live-translation.js"></script>
    <script src="voice-clone.js"></script>
  </body>
</html>
