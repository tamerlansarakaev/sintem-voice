<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:"
    />
    <title>Sintem Voice</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="app">
      <nav class="sidebar">
        <div class="brand">Sintem Voice</div>
        <ul class="nav">
          <li>
            <a class="nav-link" href="#live-translation" data-page="live-translation">
              Live Translation
            </a>
          </li>
          <li>
            <a class="nav-link" href="#voice-clone" data-page="voice-clone">
              Voice Clone
            </a>
          </li>
        </ul>
      </nav>

      <main class="content">
        <section class="page" id="page-live-translation" hidden>
          <header class="page-header">
            <h1>Live Translation</h1>
            <button
              type="button"
              class="subtitles-toggle"
              id="subtitles-toggle"
              aria-pressed="false"
            >
              Live Subtitles
            </button>
          </header>
          <div class="page-body">
            <div class="controls">
              <label class="field">
                From
                <select id="live-source"></select>
              </label>
              <label class="field">
                To
                <select id="live-target"></select>
              </label>
              <label class="field">
                Output (virtual microphone)
                <select id="live-output"></select>
              </label>
              <button type="button" class="primary-button" id="live-start">
                Start
              </button>
            </div>
            <p class="status" id="live-status">
              Speak after Start: the translation plays in your voice.
            </p>
            <div class="live-text" id="live-text"></div>
          </div>
        </section>

        <section class="page" id="page-voice-clone" hidden>
          <header class="page-header">
            <h1>Voice Clone</h1>
          </header>
          <div class="page-body">
            <p class="status">
              Record only your own voice. Read the text aloud, 3–10 seconds.
              The sample stays on this computer.
            </p>
            <div class="controls">
              <label class="field">
                Text language
                <select id="voice-language">
                  <option value="en">English</option>
                  <option value="ru">Russian</option>
                </select>
              </label>
              <button type="button" class="primary-button" id="voice-record">
                Record
              </button>
            </div>
            <blockquote class="voice-prompt" id="voice-prompt"></blockquote>
            <p class="status" id="voice-status"></p>
            <audio id="voice-preview" controls hidden></audio>
          </div>
        </section>
      </main>
    </div>

    <script src="languages.js"></script>
    <script src="audio.js"></script>
    <script src="renderer.js"></script>
    <script src="live-translation.js"></script>
    <script src="voice-clone.js"></script>
  </body>
</html>
