# Linux + NVIDIA only (NVIDIA Container Toolkit on the host).
# The service has no auth: allow the port only from the backend host
# (firewall / private network), never from the internet.

services:
  translate:
    build: .
    ports:
      - "8080:8080"
    environment:
      MODEL_REPO: 17slever17/translate-gemma-4-sub-e2b-GGUF
      MODEL_REVISION: dc7285667d34af7679d4d6b824d6565e7b69ec84
      MODEL_FILE: translate_gemma4_sub-E2B-Q4_K_XL.gguf
      MODEL_SHA256: ade14eaefcd3f70051f87a359b48e284b456d757b3d63ce7c8b397991b5b9d8d
      CTX_SIZE: 4096
    volumes:
      # Weights are downloaded here on first start and reused afterwards.
      - translate-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  translate-models:
