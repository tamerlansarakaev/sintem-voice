services:
  translate:
    build: .
    ports:
      - "8100:8100"
    environment:
      # Unset passes an empty value, and start.sh then uses its own default.
      PARALLEL: ${PARALLEL:-}
      CTX_SIZE: ${CTX_SIZE:-}
    volumes:
      - ../models/translate:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
