# Linux + NVIDIA only (NVIDIA Container Toolkit on the host).
# No published ports: the service has no auth and only the backend talks to it.

services:
  tts:
    build: .
    environment:
      MODEL_REPO: openbmb/VoxCPM2
      MODEL_REVISION: 32279effe8c19989596f05d353d1447f51d9e915
    volumes:
      # Weights are downloaded here on first start and reused afterwards.
      # A named volume inherits /models ownership from the image, so the
      # non-root user can write to it (a bind mount would be root-owned).
      - tts-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  tts-models:
