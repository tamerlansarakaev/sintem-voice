services:
  tts:
    build: .
    ports:
      - "8200:8200"
    environment:
      INFERENCE_TIMESTEPS: ${INFERENCE_TIMESTEPS:-10}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.75}
      TTS_HISTORY_S: ${TTS_HISTORY_S:-10}
    volumes:
      # A named volume inherits /models ownership from the image, so the
      # non-root user can write to it (a bind mount would be root-owned).
      - tts-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  tts-models:
